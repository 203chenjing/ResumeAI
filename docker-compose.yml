version: "3.9"

services:
  backend:
    build: ./backend
    container_name: resume-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/exports:/app/exports
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: resume-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
