# =============================================================================
# ResumeAI 秋招爬虫生产配置
# 合规原则：
#   1. 仅抓取公开页面（不登录、不绕过付费墙、不爬 BOSS/智联等禁止聚合平台）
#   2. respect_robots 默认开启；高校公开招聘列表可设 ignore_robots: true
#   3. rate_limit_rps 限速，避免对目标站造成压力
#   4. 每条岗位保留 jd_url 来源链接，供用户跳转官方投递
# 修改后：POST /api/jobs/reload-config 或重启服务
# =============================================================================

compliance:
  respect_robots: true
  rate_limit_rps: 0.4
  public_pages_only: true
  user_agent: "ResumeAI-Crawler/1.0 (campus-job-aggregator; contact=local)"
  # 公开文章/高校就业列表：robots 常误拦，允许绕过（仍限速、仅公开页）
  robots_bypass_domains:
    - mp.weixin.qq.com
    - weixin.qq.com
  blocked_domains:
    - zhipin.com
    - liepin.com
    - 51job.com

providers:
  # ---------------------------------------------------------------------------
  # S1 GitHub 每日校招仓库（零 token / 零 Playwright / 高时效 / 公开合规）
  # 仓库为社区维护、MIT、专为消费；自带投递链接与内推码。
  # ---------------------------------------------------------------------------
  # 聚焦国内岗位（含在华外企）；海外仓库默认关闭，需要时再开。
  github_joblist:
    enabled: true
    china_only: false  # 国内仓库本身已是中国岗位；海外源单独用 china_only 过滤
    max_items: 300
    sources:
      - id: campus2026-cn
        name: Campus2026 互联网校招&实习（含外企中国分部）
        raw_url: https://raw.githubusercontent.com/namewyf/Campus2026/main/README.md
        channel: GitHub校招仓库
        tags: [校招, 实习, 中文, GitHub]
      - id: 0voice-spring
        name: 0voice 计算机校招汇总（含外企/国企）
        raw_url: https://raw.githubusercontent.com/0voice/2026-Computer-Spring-Recruitment-Job-Compilation/main/README.md
        channel: GitHub校招仓库
        tags: [校招, 计算机, 中文, GitHub]
      # 海外仓库：默认关闭。若想看在华岗位可设 china_only: true 过滤后开启。
      - id: speedyapply-intl
        name: speedyapply 国际校招（仅保留中国地点）
        raw_url: https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/INTERN_INTL.md
        channel: GitHub校招仓库
        tags: [校招, 海外, GitHub]
        china_only: true
        enabled: false

  # ---------------------------------------------------------------------------
  # S2 官方 ATS JSON API（Greenhouse / Lever / Ashby）零 token
  # 面向「在华外企」：china_only 仅保留中国大陆地点的岗位。
  # board 为公司在对应平台的 slug；确认 slug 后再启用对应公司。
  # ---------------------------------------------------------------------------
  ats_board:
    enabled: true
    campus_only: true
    china_only: true
    max_items_per_board: 60
    sources:
      # 以下为模板示例，slug 需逐一核对后启用（在华岗位才会保留）。
      - name: Stripe
        platform: greenhouse
        board: stripe
      - name: Databricks
        platform: greenhouse
        board: databricks
      - name: Airtable
        platform: lever
        board: airtable
        enabled: false

